# Runs the whole application (API + web UI) on http://localhost:8080
#
#   docker compose up --build
services:
  calculator:
    build: .
    image: calculator:local
    ports:
      - "8080:8080"
    restart: unless-stopped
    # Defence in depth: the process needs to write nothing and needs no
    # extra privileges.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
