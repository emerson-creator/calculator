name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The race detector needs cgo, which Linux runners have out of the box.
      - name: Test
        run: go test ./... -race -coverprofile=coverage.out

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -n 1
          go tool cover -html=coverage.out -o coverage.html

      # A short fuzzing session on every run; the parser must never panic.
      - name: Fuzz the expression parser
        run: go test ./internal/expression -run='^$' -fuzz=FuzzEvaluate -fuzztime=20s

      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.html

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run coverage

      # "build" type-checks the whole project before bundling.
      - name: Type-check and build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t calculator .

      - name: Smoke test
        run: |
          docker run -d --name calculator -p 8080:8080 calculator

          # Wait for the server to accept connections.
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:8080/healthz > /dev/null; then break; fi
            sleep 0.5
          done

          echo "API answers:"
          curl -fsS -X POST http://localhost:8080/api/v1/evaluate \
            -H 'Content-Type: application/json' \
            -d '{"expression":"2 * (3 + 4) ^ 2"}' | tee /dev/stderr | grep -q '"result":98'

          echo "Web application is served:"
          curl -fsS http://localhost:8080/ | grep -q '<title>Calculator</title>'

      - name: Container logs
        if: always()
        run: docker logs calculator || true
